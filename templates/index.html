<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Messenger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        /* Общие стили и Темная тема */
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }

        .container { 
            background: #1e293b; 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px;
            border: 1px solid #334155;
        }

        h2, h3 { color: #38bdf8; margin-top: 0; }

        #chat-ui { display: none; flex-direction: column; height: 500px; }

        /* Список пользователей */
        #user-list { 
            font-size: 0.9rem; 
            color: #94a3b8; 
            margin-bottom: 1rem; 
            padding: 8px;
            background: #0f172a;
            border-radius: 8px;
        }

        /* Сообщения */
        #messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            border: 1px solid #334155; 
            margin-bottom: 1rem; 
            padding: 1rem; 
            border-radius: 8px;
            background: #0f172a;
        }

        .msg-item { margin-bottom: 10px; line-height: 1.4; }
        .msg-author { color: #38bdf8; font-weight: bold; }

        /* Поля ввода и кнопки */
        input { 
            width: calc(100% - 24px); 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            background: #1e293b; 
            color: white;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }

        button { 
            width: 100%; 
            padding: 12px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }

        /* Скроллбар */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-ui">
        <h2>Войти в сеть</h2>
        <input type="text" id="username" placeholder="Ваш никнейм..." autocomplete="off">
        <button onclick="joinChat()">Начать общение</button>
    </div>

    <div id="chat-ui">
        <h3>В сети:</h3>
        <div id="user-list">Ожидание других...</div>
        
        <div id="messages"></div>
        
        <input type="text" id="msg-input" placeholder="Введите сообщение..." autocomplete="off">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    const socket = io({
        transports: ['websocket', 'polling']
    });
    
    let myName = "";

    function joinChat() {
        const input = document.getElementById('username');
        if (input.value.trim() !== "") {
            myName = input.value;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            socket.emit('join', myName);
        }
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        if (input.value.trim() !== "") {
            socket.emit('send_message', {
                user: myName,
                text: input.value
            });
            input.value = '';
        }
    }
    socket.on('update_users', (users) => {
        document.getElementById('user-list').innerText = users.length > 0 ? users.join(', ') : "Ожидание других...";
    });

    socket.on('receive_message', (data) => {
        const msgDiv = document.getElementById('messages');
        const item = document.createElement('div');
        item.className = 'msg-item';
        item.innerHTML = <span class="msg-author">${data.user}:</span> ${data.text};
        msgDiv.appendChild(item);
        msgDiv.scrollTop = msgDiv.scrollHeight;
    });

    // Отправка по Enter
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if (document.getElementById('login-ui').style.display !== 'none') {
                joinChat();
            } else {
                sendMessage();
            }
        }
    });
</script>

</body>
</html>
