<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dark Messenger</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;

            background: #1e293b;

            padding: 20px;

            border-radius: 12px;
        }

        h2, h3 {
            color: #38bdf8;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 10px;

            border: none;
            border-radius: 8px;

            background: #334155;
            color: white;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #0284c7;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        #chat-ui {
            display: none;
            flex-direction: column;
        }

        #messages {
            height: 300px;

            overflow-y: auto;

            background: #0f172a;

            margin-bottom: 10px;

            padding: 10px;

            border-radius: 8px;
        }

        .msg-item {
            margin-bottom: 8px;
        }

        .msg-author {
            color: #38bdf8;
            font-weight: bold;
        }

        #user-list {
            margin-bottom: 10px;

            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="login-ui">
        <h2>Войти в сеть</h2>

        <input
            type="text"
            id="username"
            placeholder="Ваш никнейм..."
            autocomplete="off"
        >

        <button onclick="joinChat()">
            Начать общение
        </button>
    </div>

    <div id="chat-ui">

        <h3>В сети:</h3>

        <div id="user-list">
            Ожидание других...
        </div>

        <div id="messages"></div>

        <input
            type="text"
            id="msg-input"
            placeholder="Введите сообщение..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Отправить
        </button>

    </div>

</div>

<script>
    const socket = io({
    transports: ["websocket", "polling"]
});

    let myName = "";

    socket.on("connect", () => {
        console.log("Подключено к серверу");
    });

    socket.on("connect_error", (err) => {
        console.error(err);
        alert("Ошибка подключения к серверу");
    });

    function joinChat() {

        const input = document.getElementById("username");

        if (input.value.trim() === "") {
            alert("Введите ник");
            return;
        }

        myName = input.value.trim();

        document.getElementById("login-ui").style.display = "none";

        document.getElementById("chat-ui").style.display = "flex";

        socket.emit("join", myName);
    }

    function sendMessage() {

        const input = document.getElementById("msg-input");

        if (input.value.trim() === "") return;

        socket.emit("send_message", {
            user: myName,
            text: input.value
        });

        input.value = "";
    }

    socket.on("update_users", (users) => {

        document.getElementById("user-list").innerText =
            users.length > 0
                ? users.join(", ")
                : "Ожидание других...";
    });

    socket.on("receive_message", (data) => {

        const msgDiv = document.getElementById("messages");

        const item = document.createElement("div");

        item.className = "msg-item";

        item.innerHTML =
            `<span class="msg-author">${data.user}:</span> ${data.text}`;

        msgDiv.appendChild(item);

        msgDiv.scrollTop = msgDiv.scrollHeight;
    });

    document.addEventListener("keypress", (e) => {

        if (e.key === "Enter") {

            if (
                document.getElementById("login-ui").style.display !== "none"
            ) {
                joinChat();
            } else {
                sendMessage();
            }
        }
    });
</script>

</body>
</html>
