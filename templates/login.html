<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dark Messenger</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-box">

    <h1>Dark Messenger</h1>

    <input id="username" placeholder="Логин">

    <input id="password" type="password" placeholder="Пароль">

    <button onclick="register()">
        Регистрация
    </button>

    <button onclick="login()">
        Войти
    </button>

</div>

<script>

async function register(){

    const username = document.getElementById('username').value

    const password = document.getElementById('password').value

    const req = await fetch('/register', {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            username,
            password
        })
    })

    const data = await req.json()

    alert(data.success ? 'Аккаунт создан' : data.message)
}


async function login(){

    const username = document.getElementById('username').value

    const password = document.getElementById('password').value

    const req = await fetch('/login', {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            username,
            password
        })
    })

    const data = await req.json()

    if(data.success){
        location.href = '/chat'
    }else{
        alert(data.message)
    }
}

</script>

</body>
</html>
